name: 游戏角色超话自动化监控-App精准版

on:
  schedule:
    - cron: '0 * * * *' # 每小时运行一次
  workflow_dispatch: # 允许手动点击运行

jobs:
  scrape_and_update:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write

    steps:
    - name: 检出代码
      uses: actions/checkout@v3

    - name: 配置 Python 环境
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: 安装依赖包
      run: pip install requests pandas streamlit pytz plotly

    - name: 运行爬虫
      env:
        # 核心：将保险箱里的秘密映射给代码
        WEIBO_APP_URL: ${{ secrets.WEIBO_APP_URL }}
        WEIBO_AUTH: ${{ secrets.WEIBO_AUTH }}
        WEIBO_SESSION: ${{ secrets.WEIBO_SESSION }}
      run: python main.py 

    - name: 保存数据回 GitHub
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add game_character_top7.csv
        git commit -m "🤖 自动更新：抓取App端精准热度数据" || exit 0
        git push
